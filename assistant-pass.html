<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="totw-build" content="v13.1.27-assistant-pass-2026-08-14">
<title>Assistant pass · Tale of Two Weddings</title>
<link rel="icon" href="totw-logo-square.jpg?v=3" type="image/jpeg">
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap');
:root{--ink:#171513;--soft:#736d66;--line:#e5ddd1;--paper:#fffdf9;--ivory:#f6f1e9;--wine:#71002d;--gold:#a77a32;--serif:'Playfair Display',serif;--sans:'DM Sans',sans-serif;--mono:'DM Mono',monospace}
*{box-sizing:border-box}body{margin:0;background:var(--ivory);color:var(--ink);font-family:var(--sans);min-height:100vh}
.hero{padding:22px max(18px,calc((100vw - 640px)/2)) 56px;background:linear-gradient(145deg,#500020,#7b163c);color:#fff}
.brand{display:flex;align-items:center;gap:12px}
.brand img{width:56px;height:56px;border-radius:6px}
.brand span{font:8px var(--mono);letter-spacing:.15em;text-transform:uppercase;color:#ead5bb}
.hero h1{margin:32px 0 8px;font:600 clamp(34px,8vw,52px)/.95 var(--serif)}
.hero p{margin:0;color:#e7d8de;font-size:13px;line-height:1.6}
.shell{width:min(640px,100%);margin:-28px auto 0;padding:0 14px 70px}
.card{margin-bottom:12px;padding:18px;border:1px solid var(--line);border-radius:18px;background:var(--paper);box-shadow:0 12px 38px rgba(47,31,22,.07)}
.loading,.error{text-align:center;padding:48px 18px;color:var(--soft);font-size:13px;line-height:1.6}
.error{background:#f3e3e3;color:#923c3c;border-radius:12px;text-align:left}
.kicker{color:var(--gold);font:8px var(--mono);letter-spacing:.13em;text-transform:uppercase}
h2{font-family:var(--serif);margin:8px 0 0;font-size:32px}
.muted{color:var(--soft);font-size:12px;line-height:1.55;margin:8px 0 0}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:1px;padding:0;overflow:hidden}
.facts div{padding:16px}
.facts span{display:block;color:var(--soft);font:7px var(--mono);letter-spacing:.08em;text-transform:uppercase}
.facts strong{display:block;margin-top:6px;font-size:18px;font-family:var(--serif);font-weight:600}
.event{padding:0;overflow:hidden}
.event-head{padding:18px}
.event-head h3{margin:6px 0 0;font:600 26px/1 var(--serif)}
.event-head p{margin:8px 0 0;color:var(--soft);font-size:13px;line-height:1.5}
.map{display:inline-flex;margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--wine);color:#fff;font:500 9px var(--mono);letter-spacing:.1em;text-transform:uppercase;text-decoration:none}
.note{font-size:11px;color:var(--soft);line-height:1.55;margin-top:16px}
@media(max-width:560px){.facts{grid-template-columns:1fr}.hero h1{margin-top:24px}}
</style>
</head>
<body>
<header class="hero">
  <div class="brand"><img src="totw-logo-square.jpg" alt="Tale of Two Weddings"><span>Studio briefing</span></div>
  <h1>Assistant<br>pass</h1>
  <p>Arrival, location and client name only. No login.</p>
</header>
<main class="shell" id="app"><section class="card loading">Opening the briefing…</section></main>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script>
const FIREBASE={apiKey:"AIzaSyCV14o1M9eUANLRxG_JrDZH2aGfqY3kjA4",authDomain:"tot-ledger.firebaseapp.com",databaseURL:"https://tot-ledger-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"tot-ledger",storageBucket:"tot-ledger.firebasestorage.app",messagingSenderId:"595678125258",appId:"1:595678125258:web:01fef3d4661b6f52346833"};
const token=new URLSearchParams(location.search).get('t')||'';
const app=document.getElementById('app');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmtDate(iso){if(!iso)return 'Date pending';return new Date(iso+'T12:00:00').toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}
function fmtTime(v){if(!v)return 'Time pending';const[h,m]=String(v).split(':').map(Number);return `${h%12||12}:${String(m||0).padStart(2,'0')} ${h>=12?'PM':'AM'}`}
function error(message){app.innerHTML=`<section class="card"><div class="error">${esc(message)}</div></section>`}
function mapsHref(url){return /^https:\/\//i.test(url||'')?url:''}
function render(pass){
  const rows=Object.entries(pass.events||{}).map(([id,e])=>({id,...e})).sort((a,b)=>String(a.arrivalTime||'').localeCompare(String(b.arrivalTime||'')));
  app.innerHTML=`
    <section class="card facts">
      <div><span>Client</span><strong>${esc(pass.couple||'—')}</strong></div>
      <div><span>Date</span><strong>${esc(fmtDate(pass.date))}</strong></div>
    </section>
    ${rows.map(e=>`<section class="card event"><div class="event-head">
      <div class="kicker">${esc(fmtTime(e.arrivalTime))} arrival</div>
      <h3>${esc(e.eventName||'Event')}</h3>
      <p>${esc(e.venueName||'Location to be shared')}</p>
      ${mapsHref(e.mapsUrl)?`<a class="map" href="${esc(mapsHref(e.mapsUrl))}" target="_blank" rel="noopener">Open location ↗</a>`:''}
    </div></section>`).join('')||`<section class="card"><p class="muted">No events on this pass yet.</p></section>`}
    <p class="note">This is a briefing only. It does not check you in and does not show crew, pay or client contacts.</p>`;
}
async function boot(){
  if(!/^[a-f0-9]{48}$/i.test(token))return error('This assistant-pass link is incomplete. Ask Tale of Two Weddings for a fresh link.');
  try{
    firebase.initializeApp(FIREBASE);
    const snap=await firebase.database().ref('assistantPasses/'+token).once('value');
    const pass=snap.val();
    if(!pass)return error('This pass was removed or replaced. Ask the studio for a fresh link.');
    render(pass);
  }catch(e){
    error('The briefing could not load. Check your connection and try again.');
  }
}
boot();
</script>
</body>
</html>
