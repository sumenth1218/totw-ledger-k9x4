<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<meta name="totw-build" content="v13.1.0-traditional-day-pass-beta-2026-08-11">
<title>Traditional Day Pass · Tale of Two Weddings</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap');
:root{--ink:#171513;--soft:#736d66;--line:#e5ddd1;--paper:#fffdf9;--ivory:#f6f1e9;--wine:#71002d;--gold:#a77a32;--green:#42654b;--serif:'Playfair Display',serif;--sans:'DM Sans',sans-serif;--mono:'DM Mono',monospace}*{box-sizing:border-box}body{margin:0;background:var(--ivory);color:var(--ink);font-family:var(--sans);min-height:100vh}.hero{padding:22px max(18px,calc((100vw - 760px)/2)) 60px;background:linear-gradient(145deg,#500020,#7b163c);color:white}.brand{display:flex;align-items:center;gap:12px}.brand img{width:64px;height:64px;border-radius:6px}.brand span{font:8px var(--mono);letter-spacing:.15em;text-transform:uppercase;color:#ead5bb}.hero h1{margin:38px 0 9px;font:600 clamp(38px,9vw,62px)/.95 var(--serif)}.hero p{margin:0;color:#e7d8de;font-size:12px;line-height:1.6}.shell{width:min(760px,100%);margin:-28px auto 0;padding:0 14px 70px;position:relative}.card{margin-bottom:12px;padding:18px;border:1px solid var(--line);border-radius:18px;background:var(--paper);box-shadow:0 12px 38px rgba(47,31,22,.07)}.loading{text-align:center;padding:70px 20px;color:var(--soft)}h2,h3{font-family:var(--serif);margin:0}.kicker{color:var(--gold);font:8px var(--mono);letter-spacing:.13em;text-transform:uppercase}.muted{color:var(--soft);font-size:11px;line-height:1.55}.btn{width:100%;min-height:48px;border:0;border-radius:12px;background:var(--wine);color:white;font:500 9px var(--mono);letter-spacing:.1em;text-transform:uppercase;cursor:pointer}.btn.secondary{background:white;color:var(--wine);border:1px solid var(--line)}.btn:disabled{opacity:.45}.field{display:grid;gap:6px;margin-top:12px}.field label{color:var(--soft);font:8px var(--mono);letter-spacing:.08em;text-transform:uppercase}.field input,.field select{width:100%;min-height:46px;border:1px solid var(--line);border-radius:11px;background:white;padding:11px 12px;font:14px var(--sans)}.error{padding:13px;border-radius:11px;background:#f3e3e3;color:#923c3c;font-size:11px;line-height:1.5}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;padding:0;overflow:hidden}.summary div{padding:15px;background:var(--paper)}.summary span,.summary strong,.summary small{display:block}.summary span{color:var(--soft);font:7px var(--mono);letter-spacing:.08em;text-transform:uppercase}.summary strong{margin-top:5px;font-size:12px}.summary small{margin-top:4px;color:var(--soft);font-size:9px}.status{display:flex;align-items:center;gap:9px}.status i{width:9px;height:9px;border-radius:50%;background:#ba9657}.status.active i{background:#4f805c}.event{padding:0;overflow:hidden}.event-head{padding:17px 18px;border-bottom:1px solid var(--line)}.event-head h3{font-size:24px}.event-head p{margin:6px 0 0;color:var(--soft);font-size:10px}.event-body{padding:16px 18px}.map{display:inline-flex;margin-top:10px;color:var(--wine);font:500 9px var(--mono);text-transform:uppercase}.checklist{display:grid;gap:7px;margin-top:12px}.check{display:flex;gap:10px;align-items:flex-start;padding:11px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:11px;line-height:1.45}.check input{width:18px;height:18px;accent-color:var(--wine);flex:0 0 auto}.finish-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.duration{padding:12px;border-radius:11px;background:#f2ece3;color:#5d554d;font-size:11px;line-height:1.5}.signout{display:block;margin:20px auto 0;border:0;background:none;color:var(--soft);font:8px var(--mono);text-transform:uppercase;text-decoration:underline;cursor:pointer}@media(max-width:560px){.summary{grid-template-columns:1fr}.finish-grid{grid-template-columns:1fr}.hero h1{margin-top:30px}}
</style>
</head>
<body>
<header class="hero"><div class="brand"><img src="totw-logo-square.jpg" alt="Tale of Two Weddings"><span>Private traditional operations</span></div><h1>Traditional<br>Day Pass</h1><p>One secure pass for the person responsible for the traditional unit on location.</p></header>
<main class="shell" id="app"><section class="card loading">Opening your secure day pass…</section></main>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-functions-compat.js"></script>
<script>
const FIREBASE={apiKey:"AIzaSyCV14o1M9eUANLRxG_JrDZH2aGfqY3kjA4",authDomain:"tot-ledger.firebaseapp.com",databaseURL:"https://tot-ledger-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"tot-ledger",storageBucket:"tot-ledger.firebasestorage.app",messagingSenderId:"595678125258",appId:"1:595678125258:web:01fef3d4661b6f52346833"};
const token=new URLSearchParams(location.search).get('t')||'';let auth,db,fn,user=null,passId='',pass=null,shotLists={};const app=document.getElementById('app');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmtDate(iso){if(!iso)return 'Date pending';return new Date(iso+'T12:00:00').toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'long',year:'numeric'})}
function fmtTime(v){if(!v)return 'Time pending';const[h,m]=String(v).split(':').map(Number);return `${h%12||12}:${String(m||0).padStart(2,'0')} ${h>=12?'PM':'AM'}`}
function duration(a,b){if(!a)return 'The working duration starts at check-in.';const end=b||Date.now(),min=Math.max(0,Math.round((end-a)/60000));return `${Math.floor(min/60)} hr ${min%60} min${b?' recorded':' so far'}`}
function error(message){app.innerHTML=`<section class="card"><div class="error">${esc(message)}</div></section>`}
async function boot(){if(token.length<40)return error('This day-pass link is incomplete. Ask the traditional partner or Tale of Two Weddings for a fresh link.');try{firebase.initializeApp(FIREBASE);auth=firebase.auth();db=firebase.database();fn=firebase.app().functions('asia-southeast1');await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);auth.onAuthStateChanged(async value=>{user=value||null;if(!user)return renderLogin();await claim();});}catch(e){error('The day pass could not connect. Please reload and try again.')}}
function renderLogin(){app.innerHTML=`<section class="card"><div class="kicker">Secure captain access</div><h2 style="font-size:31px;margin-top:9px">Confirm who is responsible today</h2><p class="muted">Sign in with your Google account. You will receive access only to this wedding date, and you will not be added as permanent crew.</p><button class="btn" onclick="signIn()">Continue with Google</button></section>`}
function signIn(){const p=new firebase.auth.GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});auth.signInWithPopup(p).catch(e=>{if(e.code==='auth/popup-blocked')auth.signInWithRedirect(p);else if(e.code!=='auth/popup-closed-by-user')error('Google sign-in could not be completed. Open this link in Safari or Chrome.')})}
async function claim(){app.innerHTML='<section class="card loading">Securing this pass for you…</section>';try{const result=await fn.httpsCallable('claimTraditionalDayPass')({token});passId=result.data.passId;const [lists]=await Promise.all([db.ref('shotLists').once('value')]);shotLists=lists.val()||{};db.ref(`traditionalPasses/${passId}`).on('value',s=>{pass=s.val()||null;if(!pass)return error('This pass was removed or replaced by the studio.');render();},()=>error('This pass is no longer available to this account.'));}catch(e){console.error(e);error((e&&e.message)||'This pass is invalid, expired, already claimed or revoked. Ask for a fresh pass.') }}
function listItems(event){const raw=shotLists[event.traditionalListKey]&&shotLists[event.traditionalListKey].traditional,arr=Array.isArray(raw)?raw:Object.values(raw||{});return arr.map(x=>typeof x==='string'?x:(x&&x.t||x&&x.text||'')).filter(Boolean)}
function eventCard(id,event){const items=listItems(event),done=(pass.checklists&&pass.checklists[id])||{};return `<section class="card event"><div class="event-head"><div class="kicker">${esc(fmtDate(event.date))}</div><h3>${esc(event.name)}</h3><p>${esc(fmtTime(event.startTime))}${event.endTime?' – '+esc(fmtTime(event.endTime)):''} · ${esc(event.venueName||'Venue pending')}</p>${event.mapsUrl?`<a class="map" href="${esc(event.mapsUrl)}" target="_blank" rel="noopener">Open Maps ↗</a>`:''}</div><div class="event-body"><div class="kicker">Traditional checklist</div>${items.length?`<div class="checklist">${items.map((text,i)=>`<label class="check"><input type="checkbox" ${done[i]?'checked':''} onchange="saveCheck('${esc(id)}','${i}',this.checked)"><span>${esc(text)}</span></label>`).join('')}</div>`:'<p class="muted">The studio has not assigned a traditional checklist for this event yet.</p>'}</div></section>`}
function render(){if(!pass)return;const active=!!pass.checkedInAt&&!pass.checkedOutAt,finished=!!pass.checkedOutAt;if(!pass.captainPhone)return renderCaptainSetup();const events=Object.entries(pass.events||{}).sort((a,b)=>String(a[1].startTime||'').localeCompare(String(b[1].startTime||'')));app.innerHTML=`<section class="card summary"><div><span>Wedding</span><strong>${esc(pass.couple)}</strong><small>${esc(fmtDate(pass.date))}</small></div><div><span>Traditional unit</span><strong>${esc((pass.tpCount||0)+' TP + '+(pass.tvCount||0)+' TV')}</strong><small>${esc(pass.partnerName||'Traditional partner')}</small></div><div><span>Reporting</span><strong>${esc(fmtTime(pass.reportingTime))}</strong><small>Captain: ${esc(pass.captainName||user.displayName||'Confirmed')}</small></div></section><section class="card"><div class="status ${active||finished?'active':''}"><i></i><div><div class="kicker">${finished?'Day completed':active?'Traditional day active':'Ready to begin'}</div><strong>${esc(finished?duration(pass.checkedInAt,pass.checkedOutAt):active?duration(pass.checkedInAt):'Check in when the traditional unit reaches the first event')}</strong></div></div>${!pass.checkedInAt?'<button class="btn" style="margin-top:15px" onclick="checkIn()">Start traditional day</button>':''}</section>${events.map(([id,e])=>eventCard(id,e)).join('')}${pass.checkedInAt&&!pass.checkedOutAt?finishCard():''}${finished?`<section class="card"><div class="kicker">Handover recorded</div><h2 style="font-size:28px;margin-top:8px">Traditional day complete</h2><p class="muted">${esc(pass.cardsUsed||0)} cards used · ${esc(pass.dataStatus||'Status recorded')} · handed to ${esc(pass.handoverName||'studio contact')}</p><div class="duration">Total working time: ${esc(duration(pass.checkedInAt,pass.checkedOutAt))}</div></section>`:''}<button class="signout" onclick="auth.signOut()">Sign out</button>`}
function renderCaptainSetup(){app.innerHTML=`<section class="card"><div class="kicker">On-ground captain</div><h2 style="font-size:31px;margin-top:9px">Confirm your details</h2><p class="muted">You are responsible for check-in, the traditional checklist and final cards/data handover for this unit.</p><div class="field"><label>Your name</label><input id="captainName" value="${esc(pass.captainName||user.displayName||'')}"></div><div class="field"><label>Your mobile number</label><input id="captainPhone" type="tel" inputmode="tel" placeholder="10-digit mobile number"></div><button class="btn" style="margin-top:15px" onclick="saveCaptain()">Confirm responsibility</button></section>`}
function finishCard(){return `<section class="card"><div class="kicker">Finish and hand over</div><h2 style="font-size:28px;margin-top:8px">Complete the traditional day</h2><div class="finish-grid"><div class="field"><label>Cards used</label><input id="cardsUsed" type="number" min="0" max="100" value="0"></div><div class="field"><label>Data/card status</label><select id="dataStatus"><option value="handed_over">Handed over</option><option value="copying">Copying in progress</option><option value="with_captain">Still with captain</option></select></div></div><div class="field"><label>Handed over to / responsible person</label><input id="handoverName" placeholder="Name required"></div><button class="btn" style="margin-top:15px" onclick="checkOut()">Finish day & record handover</button></section>`}
async function saveCaptain(){const name=document.getElementById('captainName').value.trim(),phone=document.getElementById('captainPhone').value.replace(/\D/g,'');if(name.length<2||phone.length<10||phone.length>15)return alert('Enter your name and a valid mobile number.');await safeUpdate({captainName:name,captainPhone:phone,confirmedAt:firebase.database.ServerValue.TIMESTAMP,status:'confirmed',updatedAt:firebase.database.ServerValue.TIMESTAMP})}
async function checkIn(){if(!confirm('Start the traditional workday now?'))return;await safeUpdate({checkedInAt:firebase.database.ServerValue.TIMESTAMP,status:'active',updatedAt:firebase.database.ServerValue.TIMESTAMP})}
async function saveCheck(eventId,index,value){const updates={};updates[`checklists/${eventId}/${index}`]=!!value;updates.updatedAt=firebase.database.ServerValue.TIMESTAMP;await safeUpdate(updates)}
async function checkOut(){const cards=Number(document.getElementById('cardsUsed').value),dataStatus=document.getElementById('dataStatus').value,handoverName=document.getElementById('handoverName').value.trim();if(!Number.isInteger(cards)||cards<0||cards>100||!handoverName)return alert('Enter the cards used and the person responsible for the handover.');if(!confirm('Finish the traditional day and record this handover?'))return;await safeUpdate({cardsUsed:cards,dataStatus,handoverName,checkedOutAt:firebase.database.ServerValue.TIMESTAMP,status:'finished',updatedAt:firebase.database.ServerValue.TIMESTAMP})}
async function safeUpdate(values){try{await db.ref(`traditionalPasses/${passId}`).update(values)}catch(e){console.error(e);alert('This update could not be saved. Check your connection or ask the studio for a fresh pass.')}}
boot();
</script>
</body></html>
